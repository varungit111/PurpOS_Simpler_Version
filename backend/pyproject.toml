[project]
name = "purpos-backend"
version = "0.1.0"
description = "FastAPI foundation for the PurpOS prototype."
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0"
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py311"
